name: Kognos CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Content security (PostgreSQL / two users)
        run: npm run test:content-db
      - name: Design tests
        run: npm run test:design
      - name: Type checking
        run: npm run typecheck

      - name: Production build
        run: npm run build
